<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · living codes lab</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='4' fill='%235eead4'/></svg>">
<style>
  :root { --bg:#0a0d0f; --fg:#d6e0de; --dim:#8fa09f; --muted:#5c6b6b; --accent:#5eead4;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --serif:'Fraunces',Georgia,serif; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:#f6f5f0; --fg:#1d2220; --dim:#55605d; --muted:#8b918d; --accent:#0f766e; }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--mono); }
  .box { min-height:100vh; display:grid; place-content:center; text-align:center; padding:2rem; }
  h1 { font-family:var(--serif); font-style:italic; font-weight:340; font-size:clamp(3rem,12vw,7rem); margin:0; line-height:1; }
  h1 span { color:var(--accent); }
  p { color:var(--dim); margin-top:1.2rem; font-size:.9rem; }
  a { color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent); }
  .seq { color:var(--muted); font-size:.78rem; margin-top:2.5rem; letter-spacing:.35em; }
</style>
</head>
<body>
  <div class="box">
    <h1>4<span>0</span>4</h1>
    <p>an unplaced read — this sequence doesn't map anywhere in the site.</p>
    <p><a href="/">align to the reference page →</a></p>
    <p class="seq">ACGTACGTACGT</p>
  </div>
</body>
</html>
